name: QR-SIDE installation check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: '4.4'
          - os: macos-latest
            r: 'release'
          - os: windows-latest
            r: 'release'
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      QRSIDE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      QRSIDE_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libglpk-dev libgsl-dev
      - name: Install from the downloadable source package
        shell: Rscript {0}
        run: |
          options(Ncpus = 2L)
          source("scripts/check_archive.R")
          source("install_qrside.R")
          install_qrside(repo = Sys.getenv("QRSIDE_REPO"), ref = Sys.getenv("QRSIDE_REF"))
      - name: Verify installation failure reporting
        shell: Rscript {0}
        run: |
          source("scripts/check_installer.R")
      - name: Run complete model and regression tests
        shell: Rscript {0}
        run: |
          source("tests/runtime.R")
      - name: Run the download-and-use example
        shell: Rscript {0}
        run: |
          source("inst/examples/quickstart.R")
      - name: Run the real MOB dataset
        if: runner.os == 'Linux'
        shell: Rscript {0}
        run: |
          source(system.file("examples", "MOB.R", package = "QRSIDE"))
          run_mob_example()
      - name: Check source package
        shell: bash
        run: |
          R CMD build . --no-build-vignettes
          R CMD check QRSIDE_1.0.1.tar.gz --no-manual --no-build-vignettes
          Rscript scripts/check_package.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-check-${{ runner.os }}
          path: QRSIDE.Rcheck
